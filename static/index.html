<script>
// 服务端(preview.py/bridge.py)启动时会将下方占位符替换为 config/config.json 中的真实链接
const EXT_LINKS={finger:"__FINGER_LOOKUP_URL__",homework:"__HOMEWORK_REVIEW_URL__"};
function mascot(s,still){
  return '<svg class="mascot" width="'+s+'" height="'+s+'" viewBox="0 0 100 100" style="'+(still?'animation:none':'')+'" aria-hidden="true">'
  +'<path d="M50 24 Q52 18 50 13" stroke="#1E88E5" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +'<path d="M50 4 L50.9 9.2 L55.6 11 L50.9 12.8 L50 18 L49.1 12.8 L44.4 11 L49.1 9.2 Z" fill="#FFC94D"/>'
  +'<ellipse cx="20" cy="60" rx="7" ry="10" fill="#7EC8FF"/>'
  +'<ellipse cx="80" cy="60" rx="7" ry="10" fill="#7EC8FF"/>'
  +'<rect x="17" y="24" width="66" height="64" rx="30" fill="#2B9BF4"/>'
  +'<ellipse cx="50" cy="72" rx="22" ry="14" fill="#E8F5FF"/>'
  +'<circle cx="37" cy="49" r="12" fill="#fff"/>'
  +'<circle cx="63" cy="49" r="12" fill="#fff"/>'
  +'<circle cx="37" cy="50" r="5.6" fill="#123A63"/>'
  +'<circle cx="63" cy="50" r="5.6" fill="#123A63"/>'
  +'<path transform="translate(34,45.5)" d="M0,-2.4 L0.75,-0.75 L2.4,0 L0.75,0.75 L0,2.4 L-0.75,0.75 L-2.4,0 L-0.75,-0.75 Z" fill="#fff"/>'
  +'<path transform="translate(65,45.5)" d="M0,-2.4 L0.75,-0.75 L2.4,0 L0.75,0.75 L0,2.4 L-0.75,0.75 L-2.4,0 L-0.75,-0.75 Z" fill="#fff"/>'
  +'<circle cx="40" cy="44" r="1" fill="#fff"/>'
  +'<circle cx="69" cy="44" r="1" fill="#fff"/>'
  +'<ellipse cx="27" cy="61" rx="4.5" ry="3" fill="#FFB3C1"/>'
  +'<ellipse cx="73" cy="61" rx="4.5" ry="3" fill="#FFB3C1"/>'
  +'<path d="M44 62 Q50 67 56 62" stroke="#123A63" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
  +'</svg>';
}

const Voice={
  on:false,zh:[],en:[],sel:null,
  scoreVoice(v){const n=(v.name||"").toLowerCase();let s=0;if(n.includes("xiaoxiao"))s+=130;if(n.includes("xiaoyi")||n.includes("xiaohan")||n.includes("xiaomo")||n.includes("yunxi"))s+=105;if(n.includes("natural"))s+=85;if(n.includes("neural"))s+=80;if(n.includes("online"))s+=45;if(n.includes("tingting")||n.includes("mei-jia")||n.includes("meijia")||n.includes("sinji"))s+=62;if(n.includes("yunjian")||n.includes("yunyang")||n.includes("kangkang"))s-=30;if(v.localService===false)s+=18;return s;},
  load(){if(!("speechSynthesis" in window))return;const all=speechSynthesis.getVoices();this.zh=all.filter(v=>(v.lang||"").toLowerCase().startsWith("zh")).sort((a,b)=>this.scoreVoice(b)-this.scoreVoice(a));this.en=all.filter(v=>(v.lang||"").toLowerCase().startsWith("en"));const sel=document.getElementById("voiceSel");if(!sel)return;if(!this.zh.length){sel.innerHTML="<option>未检测到中文语音</option>";return;}sel.innerHTML=this.zh.map((v,i)=>'<option value="'+i+'">'+v.name.replace(/Microsoft |Online \(Natural\) - Chinese.*|- Chinese.*/g,"").trim()+(this.scoreVoice(v)>=80?" \u2605\u63a8\u8350":this.scoreVoice(v)>=50?" \u2605\u53ef\u7528":"")+"</option>").join("");this.sel=this.zh[0];const self=this;sel.onchange=function(){self.sel=self.zh[parseInt(sel.value)];};},
  splitText(txt){return txt.replace(/([。!?；;])/g,"$1|").replace(/([，,：:])/g,"$1|").split("|").map(s=>s.trim()).filter(Boolean);},
  speak(list,done){if(!("speechSynthesis" in window)){done&&done();return;}const parts=[];list.forEach(it=>this.splitText(it.t).forEach(t=>parts.push({t:t,r:it.r,lang:it.lang||"zh-CN"})));let i=0;const self=this;function next(){if(i>=parts.length){done&&done();return;}const it=parts[i];const u=new SpeechSynthesisUtterance(it.t);u.lang=it.lang;if(it.lang.indexOf("en")===0&&self.en[0])u.voice=self.en[0];else if(self.sel)u.voice=self.sel;const natural=self.sel&&self.scoreVoice(self.sel)>=50;u.pitch=it.r==="c"?(natural?1.12:1.18):it.r==="w"?1.02:(natural?.98:1.02);u.rate=it.r==="c"?.92:it.r==="w"?.78:.84;u.volume=1;u.onend=function(){const pause=/[。!?；;]/.test(it.t)?420:240;i++;setTimeout(next,pause);};u.onerror=function(){i++;setTimeout(next,180);};speechSynthesis.speak(u);}next();},
  cancel(){if("speechSynthesis" in window)speechSynthesis.cancel();}
};
if("speechSynthesis" in window){Voice.load();speechSynthesis.onvoiceschanged=function(){Voice.load();};}

function worksheetSVG(fit){
  const cells=[[7.2,18,21.5,15.5,0],[47.8,18,21.5,15.5,0],[28.8,18,21,15.5,0],[69.5,18,21.5,15.5,0],
  [7.2,35.5,21.5,15.5,0],[29,35.5,21,15.5,0],[48,35.5,21,15.5,0],[69.5,35.5,21.5,15.5,0],
  [7.2,53.5,21.5,15.5,0],[29,53.5,21,15.5,0],[48.5,53.5,17.5,15.5,0],[70,53.5,21,16,1],
  [5.5,71,29,16,0],[35.5,71,21,16,1],[57.5,71,21,16,1]];
  const W=717,H=957;
  let cellsSvg=cells.map(function(c){
    const x=c[0]/100*W,y=c[1]/100*H,w=c[2]/100*W,h=c[3]/100*H,warn=c[4];
    const stroke=warn?'#f0c383':'#e7eef6';
    const barW=w*0.5;
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="#fff" stroke="'+stroke+'" stroke-width="2"/>'
    +'<rect x="'+(x+w*0.26)+'" y="'+(y+h*0.16)+'" width="'+barW+'" height="'+(h*0.13)+'" rx="4" fill="#c9d8e8"/>'
    +'<rect x="'+(x+w*0.26)+'" y="'+(y+h*0.37)+'" width="'+barW+'" height="'+(h*0.13)+'" rx="4" fill="#c9d8e8"/>'
    +'<rect x="'+(x+w*0.2)+'" y="'+(y+h*0.56)+'" width="'+(w*0.6)+'" height="'+(h*0.045)+'" fill="#9fb4c9"/>'
    +'<rect x="'+(x+w*0.26)+'" y="'+(y+h*0.66)+'" width="'+barW+'" height="'+(h*0.15)+'" rx="4" fill="'+(warn?'#f0c383':'#8fb7e0')+'"/>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid '+(fit==='contain'?'meet':'slice')+'" aria-hidden="true">'
  +'<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fdfbf5"/>'
  +'<rect x="36" y="34" width="'+(W-72)+'" height="52" rx="10" fill="#eef4fb"/>'
  +'<rect x="56" y="50" width="200" height="20" rx="6" fill="#a9c2dc"/>'
  +'<rect x="'+(W-250)+'" y="50" width="190" height="20" rx="6" fill="#c9d8e8"/>'
  +cellsSvg+'</svg>';
}

  function render(){
    const on=level>0;
    const STEP={
      0:{panel:0,   photo:'drop-shadow(0 12px 12px rgba(55,79,102,.16)) brightness(.96)'},
      1:{panel:.36, photo:'drop-shadow(0 12px 12px rgba(55,79,102,.16)) brightness(.98)'},
      2:{panel:.68, photo:'drop-shadow(0 12px 12px rgba(55,79,102,.16)) brightness(1)'},
      3:{panel:1,   photo:'drop-shadow(0 12px 12px rgba(55,79,102,.16)) brightness(1.01)'}
    };
    const c=STEP[level];
    const photo=document.getElementById('lampPhoto');
    const panel=document.getElementById('lampPanelInner');
    if(photo)photo.style.filter=c.photo;
    if(panel){
      panel.style.opacity=c.panel;
      panel.style.filter='saturate('+(1+level*.1)+') brightness('+(1+level*.04)+')';
    }
    const dot=document.getElementById('simDot');
    const txt=document.getElementById('simStateText');
    if(dot)dot.className='sim-dot'+(on?' on':'');
    if(txt)txt.textContent=on?(LEVELS[level]+'亮度 · '+({1:'30%',2:'60%',3:'100%'}[level])):'灯光已关闭';
    ['L0','L1','L2','L3'].forEach(function(id,i){
      const b=document.getElementById('sim'+id);
      if(b)b.className='sim-step'+(level===i?' on':'');
    });
  }
  function syncUrl(){
    const p=new URLSearchParams(location.search);
    p.set('lamp',level);
    history.replaceState(null,'','?'+p.toString());
  }
  return{
    init:function(){const el=document.getElementById('simLamp');if(el)el.innerHTML=svg();render();},
    setLevel:function(v){level=Math.max(0,Math.min(3,v));render();syncUrl();},
    getLevel:function(){return level;},
    say:function(cmd){
      if(cmd==='开灯')level=level>0?level:2;
      else if(cmd==='关灯')level=0;
      else if(cmd==='亮一点')level=Math.min(3,level+1);
      else if(cmd==='暗一点')level=Math.max(0,level-1);
      render();
      syncUrl();
    }
  };

function jumpTo(key){
  const url=(EXT_LINKS&&EXT_LINKS[key])||'';
  if(!url||url.indexOf('__')===0){
    // 未配置链接: 回退到本地演示
    openApp(key==='finger'?'lookup':'homework');

  }
  const sep=url.indexOf('?')>=0?'&':'?';
  window.location.href=url+sep+'lamp='+Lamp.getLevel();
}

  +'<div class="home-grid">'
  +homeTile(mascot(30,true),'home-blue','学伴对话','有问题问我',"","Runtime.openDialog('manual')")
  +homeTile(iconLookup(),'home-green','指尖查词','点一点就查',"","jumpTo('finger')")
  +homeTile(iconHomework(),'home-amber','作业批改','拍照交作业','',"jumpTo('homework')")
  +homeTile(iconSettings(),'home-gray','设置','灯光与家长',"","")
  +'</div>'
  +'<div class="home-bar"><div class="home-bar-avatar">'+mascot(26,true)+'</div><div class="home-bar-text">说「你好灵犀」随时叫我</div><div class="home-wave"><i style="height:7px;animation-delay:0s"></i><i style="height:12px;animation-delay:.15s"></i><i style="height:9px;animation-delay:.3s"></i><i style="height:13px;animation-delay:.45s"></i></div></div>'
  +'</div>';
}
function showHome(){
  if(currentApp!=='home'&&modules[currentApp])modules[currentApp].stop();
  currentApp='home';
  $('lampPanel').classList.remove('hidden');
  $('phonePanel').classList.add('hidden');
  $('lamp').innerHTML=homeScreen();
  $('backBtn').classList.add('hidden');
  $('dots').innerHTML='';
  $('controls').classList.add('hidden');
}
function openApp(name){
  currentApp=name;
  $('backBtn').classList.remove('hidden');
  $('controls').classList.remove('hidden');
  if(name!=='homework'){$('phonePanel').classList.add('hidden');$('lampPanel').classList.remove('hidden');}
  $('btnPlay').innerHTML='<i class="ti ti-player-pause" aria-hidden="true"></i> 暂停';
  modules[name].start();
}
function goHome(){showHome();}
$('btnPlay').onclick=function(){if(currentApp==='home')return;const p=modules[currentApp].togglePlay();this.innerHTML=p?'<i class="ti ti-player-pause" aria-hidden="true"></i> 暂停':'<i class="ti ti-player-play" aria-hidden="true"></i> 播放';};
$('btnRe').onclick=function(){if(currentApp==='home')return;modules[currentApp].replay();$('btnPlay').innerHTML='<i class="ti ti-player-pause" aria-hidden="true"></i> 暂停';};
$('btnSnd').onclick=function(){Voice.on=!Voice.on;this.innerHTML=Voice.on?'<i class="ti ti-volume" aria-hidden="true"></i> 关闭语音':'<i class="ti ti-volume" aria-hidden="true"></i> 开启语音';if(currentApp!=='home')modules[currentApp].refresh();};
Lamp.init();
// 从 URL 回读 lamp 参数, 实现从外部页面跳回时灯光状态延续
const lampMatch=location.search.match(/[?&]lamp=(\d+)/);
if(lampMatch)Lamp.setLevel(parseInt(lampMatch[1],10)||0);
showHome();
</script>
<script src="/assets/runtime.js"></script>
</body>
