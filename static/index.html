<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灯终端 - AI学伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#1a1a2e;--card-bg:#f0f4f8;--navy:#123A63;--blue:#2B9BF4;--text-pri:#1B4B7A;--text-sec:#7FA3C6;--bub-u:#2B9BF4;--bub-a:#E8F2FD;}
body{background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;}
.card{background:var(--card-bg);border-radius:28px;width:340px;min-height:560px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 40px rgba(0,0,0,.3);}
.status-bar{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12px;color:var(--text-sec);margin-bottom:10px;}
.status-dot{width:9px;height:9px;border-radius:50%;background:#ccc;display:inline-block;margin-right:4px;vertical-align:middle;}
.status-dot.online{background:#4CAF50;}.status-dot.offline{background:#F44336;}.status-dot.connecting{background:#FF9800;}
.main-area{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;}
.mascot-wrap svg{display:block;}
.conversation{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:200px;overflow-y:auto;}
.bubble{max-width:85%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word;animation:fadein .3s ease;}
.bubble.user{align-self:flex-end;background:var(--bub-u);color:#fff;border-radius:14px 14px 3px 14px;}
.bubble.ai{align-self:flex-start;background:var(--bub-a);color:#2A3B4D;border-radius:14px 14px 14px 3px;}
.thinking-dots{display:flex;gap:4px;align-items:center;background:#DCEDFD;border-radius:14px 14px 14px 3px;padding:10px 14px;align-self:flex-start;}
.thinking-dots .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:dotAnim 1.2s infinite;}
.thinking-dots .dot:nth-child(2){animation-delay:.2s;}.thinking-dots .dot:nth-child(3){animation-delay:.4s;}
.wave-bars{display:flex;gap:4px;height:20px;align-items:center;justify-content:center;}
.wave-bar{width:3px;border-radius:2px;background:var(--blue);transform-origin:center;animation:waveAnim 1s infinite ease-in-out;}
.wave-bar:nth-child(2){animation-delay:.15s;}.wave-bar:nth-child(3){animation-delay:.3s;}.wave-bar:nth-child(4){animation-delay:.45s;}.wave-bar:nth-child(5){animation-delay:.6s;}
.clock-display{text-align:center;}
.clock-time{font-size:42px;font-weight:500;color:#24507E;letter-spacing:3px;}
.clock-sub{font-size:12px;color:#5B82AB;margin-top:4px;}
.bottom-area{width:100%;text-align:center;margin-top:10px;}
.hint-text{font-size:12px;color:var(--text-sec);margin-bottom:8px;min-height:18px;}
.btn{border:none;border-radius:22px;padding:9px 24px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;outline:none;display:inline-flex;align-items:center;gap:5px;}
.btn-primary{background:var(--blue);color:#fff;}.btn-primary:hover{background:#1E80E0;transform:translateY(-1px);}
.btn-stop{background:#EF5350;color:#fff;}.btn-stop:hover{background:#E53935;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes waveAnim{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes dotAnim{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breath{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(43,155,244,.4)}50%{box-shadow:0 0 0 12px rgba(43,155,244,0)}}
.breath-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:breath 2.6s infinite ease-in-out;display:inline-block;}
.recording .btn-primary{animation:pulse 1.5s infinite;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="status-bar">
    <span><span class="status-dot offline" id="sDot"></span><span id="sLabel">断开</span></span>
    <span id="timeShow">--:--</span>
  </div>
  <div class="main-area">
    <div id="idleView" class="clock-display hidden"><div class="clock-time" id="clockTime">--:--</div><div class="clock-sub">点击按钮开始对话</div><div style="margin-top:8px;font-size:11px;color:#7FA3C6;"><span class="breath-dot"></span> 我在</div></div>
    <div class="mascot-wrap" id="mascotWrap"></div>
    <div id="waveWrap" class="hidden" style="margin:6px 0;"><div class="wave-bars"><div class="wave-bar" style="height:10px"></div><div class="wave-bar" style="height:18px"></div><div class="wave-bar" style="height:14px"></div><div class="wave-bar" style="height:20px"></div><div class="wave-bar" style="height:12px"></div></div></div>
    <div class="conversation" id="conversation"></div>
    <div id="thinkWrap" class="hidden"><div class="thinking-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
    <div id="stateLabel" style="font-size:13px;font-weight:500;color:var(--text-pri);margin-top:6px;"></div>
  </div>
  <div class="bottom-area">
    <div class="hint-text" id="hintText">点击按钮开始对话</div>
    <div id="timerArea" style="margin-bottom:6px;display:none"><span id="timerLabel" style="font-size:11px;color:var(--text-sec)"></span><span id="timerCount" style="font-size:20px;font-weight:600;color:var(--navy);margin:0 4px"></span><button onclick="cancelTimer()" style="font-size:10px;border:none;background:none;color:#EF5350;cursor:pointer">取消</button></div>
    <div id="timerBtns" style="margin-bottom:6px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap"><button onclick="setTimer(5)" class="btn" style="font-size:10px;padding:3px 8px;background:#E8F2FD;color:var(--blue)">5分</button><button onclick="setTimer(10)" class="btn" style="font-size:10px;padding:3px 8px;background:#E8F2FD;color:var(--blue)">10分</button><button onclick="setTimer(15)" class="btn" style="font-size:10px;padding:3px 8px;background:#E8F2FD;color:var(--blue)">15分</button><button onclick="setTimer(25)" class="btn" style="font-size:10px;padding:3px 8px;background:#E8F2FD;color:var(--blue)">25分</button></div>
    <button class="btn btn-primary" id="mainBtn">🎤 开始对话</button>
  </div>
</div>

<script>
// ========== 吉祥物 ==========
const NAVY='#123A63',BLUE='#2B9BF4';
function mascotSVG(w,h,m){
  let e='',o='',x='';
  if(m==='sleep'){e='<path d="M31 52 Q38 57 45 52" stroke="'+NAVY+'" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M56 52 Q63 57 70 52" stroke="'+NAVY+'" stroke-width="3" fill="none" stroke-linecap="round"/>';}
  else if(m==='think'){e='<circle cx="38" cy="50" r="10.5" fill="#fff"/><circle cx="63" cy="50" r="10.5" fill="#fff"/><circle cx="40" cy="47.5" r="5.4" fill="'+NAVY+'"/><circle cx="65" cy="47.5" r="5.4" fill="'+NAVY+'"/>';o='<path d="M46 63 Q50.5 60 55 63" stroke="'+NAVY+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';x='<circle cx="50" cy="13" r="4.5" fill="#FFC94D"/>';}
  else{e='<circle cx="38" cy="50" r="10.5" fill="#fff"/><circle cx="63" cy="50" r="10.5" fill="#fff"/><circle cx="39.5" cy="51" r="5.4" fill="'+NAVY+'"/><circle cx="41.5" cy="48.8" r="2" fill="#fff"/><circle cx="64.5" cy="51" r="5.4" fill="'+NAVY+'"/><circle cx="66.5" cy="48.8" r="2" fill="#fff"/>';o='<path d="M45 62 Q50.5 67 56 62" stroke="'+NAVY+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';x='<ellipse cx="28" cy="60" rx="4" ry="2.5" fill="#FFB3C1"/><ellipse cx="73" cy="60" rx="4" ry="2.5" fill="#FFB3C1"/>';}
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 100 100" style="animation:bob 2.6s ease-in-out infinite" xmlns="http://www.w3.org/2000/svg">'+x+'<ellipse cx="20" cy="60" rx="7" ry="10" fill="#7EC8FF"/><ellipse cx="80" cy="60" rx="7" ry="10" fill="#7EC8FF"/><rect x="17" y="24" width="66" height="64" rx="30" fill="'+BLUE+'"/><ellipse cx="50" cy="72" rx="22" ry="14" fill="#E8F5FF"/>'+e+o+'</svg>';
}

const $=id=>document.getElementById(id);

// ========== 音频播放器 ==========
class AudioPlayer{
  constructor(){this.ctx=null;this.nextTime=0;this.busy=false;}
  init(){if(!this.ctx){this.ctx=new AudioContext({sampleRate:24000});this.nextTime=this.ctx.currentTime;}}
  push(bytes){
    this.init();
    if(!bytes||!bytes.byteLength) return;
    const samples=new Float32Array(bytes.byteLength/2);
    const dv=new DataView(bytes instanceof ArrayBuffer?bytes:bytes.buffer||new Uint8Array(bytes).buffer);
    for(let i=0;i<samples.length;i++) samples[i]=dv.getInt16(i*2,true)/32768;
    const buf=this.ctx.createBuffer(1,samples.length,24000);
    buf.getChannelData(0).set(samples);
    const src=this.ctx.createBufferSource();src.buffer=buf;src.connect(this.ctx.destination);
    const t=Math.max(this.ctx.currentTime,this.nextTime);
    src.start(t);this.nextTime=t+buf.duration+0.002;
  }
  reset(){if(this.ctx)this.nextTime=this.ctx.currentTime;}
  close(){if(this.ctx){this.ctx.close();this.ctx=null;}}
}

// ========== 麦克风采集 (AEC) ==========
class MicCapture{
  constructor(ondata){this.ctx=null;this.stream=null;this.src=null;this.proc=null;this.ondata=ondata;this.on=false;}
  async start(){
    if(this.on) return;
    this.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    this.ctx=new AudioContext({sampleRate:16000});
    this.src=this.ctx.createMediaStreamSource(this.stream);
    this.proc=this.ctx.createScriptProcessor(512,1,1);
    this.proc.onaudioprocess=(ev)=>{
      if(!this.on) return;
      const input=ev.inputBuffer.getChannelData(0);
      const int16=new Int16Array(input.length);
      for(let i=0;i<input.length;i++){const s=Math.max(-1,Math.min(1,input[i]));int16[i]=s<0?Math.round(s*32768):Math.round(s*32767);}
      this.ondata(int16.buffer);
    };
    this.src.connect(this.proc);this.proc.connect(this.ctx.destination);this.on=true;
  }
  stop(){this.on=false;
    try{if(this.proc)this.proc.disconnect();}catch(e){}
    try{if(this.src)this.src.disconnect();}catch(e){}
    try{if(this.stream)this.stream.getTracks().forEach(t=>t.stop());}catch(e){}
    try{if(this.ctx)this.ctx.close();}catch(e){}
  }
}

// ========== 状态 ==========
let ws=null,mic=null,player=new AudioPlayer(),listening=false,state='connecting',lastUser='';
let aiTypeTimer=null,reconDelay=1000,reconTimer=null,timerSec=0,timerInt=null;

function updateTime(){const n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');$('timeShow').textContent=t;$('clockTime').textContent=t;}
setInterval(updateTime,10000);updateTime();
function setMascot(m){$('mascotWrap').innerHTML=mascotSVG(86,86,m);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function clearChat(){$('conversation').innerHTML='';}
function addBubble(t,c){const d=document.createElement('div');d.className='bubble '+c;d.textContent=t;$('conversation').appendChild(d);d.scrollIntoView({behavior:'smooth'});}

function setUI(s){
  state=s;hide('idleView');hide('waveWrap');hide('thinkWrap');$('stateLabel').textContent='';$('card').classList.remove('recording');
  switch(s){
    case 'connecting':$('mainBtn').disabled=true;$('mainBtn').innerHTML='⏳ 连接中...';$('hintText').textContent='正在连接...';$('sDot').className='status-dot connecting';$('sLabel').textContent='连接中';setMascot('sleep');break;
    case 'disconnected':$('mainBtn').disabled=false;$('mainBtn').innerHTML='🔌 重新连接';$('mainBtn').className='btn btn-primary';$('hintText').textContent='服务断开';$('sDot').className='status-dot offline';$('sLabel').textContent='断开';setMascot('sleep');listening=false;if(mic){mic.stop();mic=null;}break;
    case 'idle':$('mainBtn').disabled=false;$('mainBtn').innerHTML='🎤 开始对话';$('mainBtn').className='btn btn-primary';$('hintText').textContent='点击按钮开始对话';$('sDot').className='status-dot online';$('sLabel').textContent='在线';show('idleView');setMascot('sleep');listening=false;if(mic){mic.stop();mic=null;}break;
    case 'listening':$('mainBtn').disabled=false;$('mainBtn').innerHTML='⏹ 停止';$('mainBtn').className='btn btn-stop';$('hintText').textContent='正在聆听...';$('card').classList.add('recording');show('waveWrap');setMascot('happy');break;
    case 'thinking':$('mainBtn').innerHTML='⏹ 停止';$('mainBtn').className='btn btn-stop';$('hintText').textContent='正在思考...';show('thinkWrap');setMascot('think');break;
    case 'speaking':$('mainBtn').disabled=false;$('mainBtn').innerHTML='⏹ 打断';$('mainBtn').className='btn btn-stop';$('hintText').textContent='AI正在说话...';show('waveWrap');setMascot('happy');break;
  }
}

function updateUser(text){const el=$('conversation').querySelector('.bubble.user:last-child');if(el)el.textContent=text;else addBubble(text,'user');lastUser=text;}
function updateAi(text,anim){
  if(aiTypeTimer){clearInterval(aiTypeTimer);aiTypeTimer=null;}
  let el=$('conversation').querySelector('.bubble.ai:last-child');
  if(!el){addBubble('','ai');el=$('conversation').querySelector('.bubble.ai:last-child');}
  if(anim){let i=el.textContent.length;aiTypeTimer=setInterval(()=>{i++;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(aiTypeTimer);},25);
  }else{el.textContent=text;}
}

// ========== WebSocket ==========
function connectWS(){
  if(ws){try{ws.close();}catch(e){}ws=null;}
  ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');ws.binaryType='arraybuffer';
  ws.onopen=()=>{reconDelay=1000;setUI('connecting');};
  ws.onmessage=(e)=>{
    if(typeof e.data==='string'){try{handleMsg(JSON.parse(e.data));}catch(err){}}
    else if(state==='speaking') player.push(e.data);
  };
  ws.onclose=()=>{ws=null;setUI('disconnected');if(reconTimer)clearTimeout(reconTimer);reconTimer=setTimeout(()=>{reconDelay=Math.min(reconDelay*2,10000);connectWS();},reconDelay);};
  ws.onerror=()=>{};
}

function handleMsg(d){
  switch(d.type){
    case 'state':setUI(d.state);break;
    case 'stt':if(d.text)updateUser(d.text);break;
    case 'llm':if(d.emotion){const m={happy:'happy',neutral:'happy',sad:'sleep',angry:'sleep',think:'think'};setMascot(m[d.emotion]||'happy');}break;
    case 'tts':if(d.state==='start'){player.reset();clearChat();if(lastUser)addBubble(lastUser,'user');}if(d.text)updateAi(d.text,true);break;
    case 'timer_start':startTimerDisp(d.seconds,d.label);break;
    case 'timer_done':timerDone(d.label);break;
    case 'error':$('hintText').textContent=d.message;break;
  }
}

// ========== 按钮 ==========
$('mainBtn').addEventListener('click',async ()=>{
  if(state==='disconnected'||state==='connecting'){connectWS();return;}
  if(state==='speaking'){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'abort'}));player.reset();clearChat();listening=false;return;}
  if(listening) stopListen();
  else await startListen();
});

async function startListen(){
  if(listening||!ws||ws.readyState!==1) return; listening=true;
  // 先发start_listening让桥接就绪, 再启动麦克风
  ws.send(JSON.stringify({type:'start_listening'}));player.reset();clearChat();
  try{mic=new MicCapture(buf=>{if(ws&&ws.readyState===1)ws.send(buf);});await mic.start();}
  catch(e){$('hintText').textContent='⚠ 请允许麦克风权限';listening=false;return;}
}
function stopListen(){listening=false;if(mic){mic.stop();mic=null;}if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'stop_listening'}));}

// ========== 计时器 ==========
function setTimer(m){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_timer',minutes:m,label:m+'分钟'}));}
function cancelTimer(){if(timerInt)clearInterval(timerInt);timerInt=null;timerSec=0;$('timerArea').style.display='none';}
function startTimerDisp(s,l){timerSec=s;$('timerLabel').textContent=l;$('timerArea').style.display='block';if(timerInt)clearInterval(timerInt);timerInt=setInterval(()=>{timerSec--;if(timerSec<=0){cancelTimer();return;}const m=Math.floor(timerSec/60),se=timerSec%60;$('timerCount').textContent=m+':'+String(se).padStart(2,'0');},1000);const m=Math.floor(timerSec/60),se=timerSec%60;$('timerCount').textContent=m+':'+String(se).padStart(2,'0');}
function timerDone(l){cancelTimer();$('hintText').textContent='⏰ '+l+' 时间到!';}

setMascot('sleep');connectWS();
</script>
</body>
</html>
