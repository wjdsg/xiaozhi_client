<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灯终端 - AI学伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#1a1a2e;--card-bg:#f0f4f8;--navy:#123A63;--blue:#2B9BF4;
  --text-primary:#1B4B7A;--text-secondary:#7FA3C6;
  --bubble-user:#2B9BF4;--bubble-ai:#E8F2FD;
}
body{
  background:var(--bg);display:flex;justify-content:center;align-items:center;
  min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;
}
.card{
  background:var(--card-bg);border-radius:28px;width:340px;height:560px;
  padding:20px 18px;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 8px 40px rgba(0,0,0,.3);position:relative;
}
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;font-size:12px;color:var(--text-secondary);margin-bottom:10px;
}
.status-dot{
  width:9px;height:9px;border-radius:50%;background:#ccc;
  display:inline-block;margin-right:4px;vertical-align:middle;
}
.status-dot.online{background:#4CAF50;}
.status-dot.offline{background:#F44336;}
.status-dot.connecting{background:#FF9800;}

.main-area{
  flex:1;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;overflow:hidden;
}
.mascot-wrap{position:relative;margin-bottom:8px;}
.mascot-wrap svg{display:block;}

.conversation{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:4px;
  max-height:450px;overflow-y:auto;padding:2px 0;}
.bubble{
  max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;
  line-height:1.6;word-break:break-word;animation:fadein .3s ease;
}
.bubble.user{
  align-self:flex-end;background:var(--bubble-user);color:#fff;
  border-radius:16px 16px 3px 16px;
}
.bubble.ai{
  align-self:flex-start;background:var(--bubble-ai);color:#2A3B4D;
  border-radius:16px 16px 16px 3px;
}

.thinking-dots{display:flex;gap:5px;align-items:center;
  background:#DCEDFD;border-radius:16px 16px 16px 3px;padding:11px 15px;
  align-self:flex-start;}
.thinking-dots .dot{
  width:7px;height:7px;border-radius:50%;background:var(--blue);
  animation:dotAnim 1.2s infinite;
}
.thinking-dots .dot:nth-child(2){animation-delay:.2s;}
.thinking-dots .dot:nth-child(3){animation-delay:.4s;}

.wave-bars{display:flex;gap:5px;height:22px;align-items:center;justify-content:center;}
.wave-bar{
  width:4px;border-radius:2px;background:var(--blue);
  transform-origin:center;animation:waveAnim 1s infinite ease-in-out;
}
.wave-bar:nth-child(2){animation-delay:.15s;}
.wave-bar:nth-child(3){animation-delay:.3s;}
.wave-bar:nth-child(4){animation-delay:.45s;}
.wave-bar:nth-child(5){animation-delay:.6s;}

.clock-display{text-align:center;}
.clock-time{font-size:46px;font-weight:500;color:#24507E;letter-spacing:3px;}
.clock-sub{font-size:13px;color:#5B82AB;margin-top:4px;}

.bottom-area{width:100%;text-align:center;margin-top:12px;}
.hint-text{font-size:12px;color:var(--text-secondary);margin-bottom:8px;min-height:18px;}

.btn{
  border:none;border-radius:24px;padding:10px 28px;font-size:15px;font-weight:500;
  cursor:pointer;transition:all .2s;outline:none;display:inline-flex;
  align-items:center;gap:6px;
}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#1E80E0;transform:translateY(-1px);}
.btn-stop{background:#EF5350;color:#fff;}
.btn-stop:hover{background:#E53935;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes waveAnim{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes dotAnim{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breath{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(43,155,244,.4)}50%{box-shadow:0 0 0 12px rgba(43,155,244,0)}}

.breath-dot{
  width:9px;height:9px;border-radius:50%;background:var(--blue);
  animation:breath 2.6s infinite ease-in-out;display:inline-block;
}
.recording .btn-primary{animation:pulse 1.5s infinite;}
.hidden{display:none !important;}

.bulb-panel{
  position:absolute;left:calc(100% + 28px);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
}
.bulb-svg{transition:all .4s ease;}
.bulb-glass{transition:fill .4s ease;}
.bulb-glow{transition:all .4s ease;}

.bulb-off .bulb-glass{fill:#E0E0E0;stroke:#BDBDBD;stroke-width:1.2;opacity:.8;}
.bulb-off .bulb-glow{opacity:0;}
.bulb-off .bulb-base{fill:#BDBDBD;}

.bulb-low .bulb-glass{fill:#FFCC80;}
.bulb-low .bulb-glow{fill:#FFCC80;opacity:.3;}
.bulb-low .bulb-base{fill:#FFB74D;}

.bulb-mid .bulb-glass{fill:#FFB74D;}
.bulb-mid .bulb-glow{fill:#FFB74D;opacity:.55;}
.bulb-mid .bulb-base{fill:#FFA726;}

.bulb-high .bulb-glass{fill:#FFC107;}
.bulb-high .bulb-glow{fill:#FFC107;opacity:.85;animation:bulbPulse 1.8s ease-in-out infinite;}
.bulb-high .bulb-base{fill:#FF9800;}

.bulb-label{font-size:13px;color:#7FA3C6;user-select:none;-webkit-user-select:none;}

@keyframes bulbPulse{
  0%,100%{opacity:.65;}
  50%{opacity:1;}
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="status-bar">
    <span><span class="status-dot offline" id="serverDot"></span><span id="serverLabel">断开</span></span>
    <span><span class="status-dot" style="background:#9C27B0;display:none" id="wwDot"></span><span id="wwLabel" style="font-size:11px;cursor:pointer" onclick="toggleWW()" title="点击切换唤醒词">唤醒:--</span></span>
    <span id="timeDisplay">--:--</span>
  </div>

  <div class="main-area" id="mainArea">
    <div id="idleView" class="clock-display hidden">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-sub">今天也很棒,一起加油!</div>
      <div style="margin-top:10px;font-size:12px;color:#7FA3C6;">
        <span class="breath-dot"></span> 我在
      </div>
    </div>

    <div class="mascot-wrap" id="mascotWrap"></div>

    <div id="waveWrap" class="hidden" style="margin:6px 0;">
      <div class="wave-bars">
        <div class="wave-bar" style="height:12px"></div>
        <div class="wave-bar" style="height:20px"></div>
        <div class="wave-bar" style="height:16px"></div>
        <div class="wave-bar" style="height:22px"></div>
        <div class="wave-bar" style="height:13px"></div>
      </div>
    </div>

    <div class="conversation" id="conversation"></div>

    <div id="thinkingWrap" class="hidden">
      <div class="thinking-dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <div id="stateLabel" style="font-size:14px;font-weight:500;color:var(--text-primary);margin-top:6px;"></div>
  </div>

  <div class="bottom-area">
    <div class="hint-text" id="hintText">点击按钮开始对话</div>
    <div id="timerArea" style="margin-bottom:6px;display:none">
      <span id="timerLabel" style="font-size:12px;color:var(--text-secondary)"></span>
      <span id="timerCount" style="font-size:22px;font-weight:600;color:var(--navy);margin:0 6px"></span>
      <button onclick="cancelTimer()" style="font-size:11px;border:none;background:none;color:#EF5350;cursor:pointer">取消</button>
    </div>
    <div id="timerBtns" style="margin-bottom:6px;display:flex;gap:6px;justify-content:center;align-items:center">
      <input id="timerInput" type="number" min="1" max="999" placeholder="分钟" inputmode="numeric"
        style="width:70px;padding:5px 8px;font-size:14px;border:1px solid #B8D4F0;border-radius:10px;text-align:center;color:var(--navy);outline:none">
      <button onclick="setTimerFromInput()" class="btn" style="font-size:12px;padding:5px 16px;background:var(--blue);color:#fff">开始倒计时</button>
    </div>
    <button class="btn btn-primary" id="mainBtn">🎤 开始对话</button>
  </div>
  <div class="bulb-panel bulb-off" id="bulbPanel" onclick="cycleBulb()" title="点击切换灯光">
    <svg class="bulb-svg" width="54" height="72" viewBox="0 0 54 72">
      <circle class="bulb-glow" cx="27" cy="27" r="26"/>
      <path class="bulb-glass" d="M8,48 Q8,22 27,10 Q46,22 46,48 L42,48 Q38,38 27,36 Q16,38 12,48 Z"/>
      <rect class="bulb-base" x="16" y="48" width="22" height="6" rx="2"/>
      <rect class="bulb-base" x="19" y="54" width="16" height="4" rx="1.5"/>
      <rect class="bulb-base" x="23" y="58" width="8" height="3" rx="1"/>
    </svg>
    <span class="bulb-label" id="bulbLabel">关</span>
  </div>
</div>

<script>
const NAVY='#123A63',BLUE='#2B9BF4';
function mascotSVG(width,height,mood){
  let eyes='',mouth='',extra='';
  if(mood==='sleep'){
    eyes='<path d="M31 52 Q38 57 45 52" stroke="'+NAVY+'" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M56 52 Q63 57 70 52" stroke="'+NAVY+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
  }else if(mood==='think'){
    eyes='<circle cx="38" cy="50" r="10.5" fill="#fff"/><circle cx="63" cy="50" r="10.5" fill="#fff"/><circle cx="40" cy="47.5" r="5.4" fill="'+NAVY+'"/><circle cx="65" cy="47.5" r="5.4" fill="'+NAVY+'"/>';
    mouth='<path d="M46 63 Q50.5 60 55 63" stroke="'+NAVY+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    extra='<line x1="50" y1="24" x2="50" y2="18" stroke="#1E88E5" stroke-width="2" stroke-linecap="round"/><circle cx="50" cy="13" r="4.5" fill="#FFC94D"/>';
  }else{
    eyes='<circle cx="38" cy="50" r="10.5" fill="#fff"/><circle cx="63" cy="50" r="10.5" fill="#fff"/><circle cx="39.5" cy="51" r="5.4" fill="'+NAVY+'"/><circle cx="41.5" cy="48.8" r="2" fill="#fff"/><circle cx="64.5" cy="51" r="5.4" fill="'+NAVY+'"/><circle cx="66.5" cy="48.8" r="2" fill="#fff"/>';
    mouth='<path d="M45 62 Q50.5 67 56 62" stroke="'+NAVY+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    extra='<ellipse cx="28" cy="60" rx="4.5" ry="3" fill="#FFB3C1"/><ellipse cx="73" cy="60" rx="4.5" ry="3" fill="#FFB3C1"/>';
  }
  return '<svg width="'+width+'" height="'+height+'" viewBox="0 0 100 100" style="animation:bob 2.6s ease-in-out infinite" xmlns="http://www.w3.org/2000/svg">'+extra+'<ellipse cx="20" cy="60" rx="7" ry="10" fill="#7EC8FF"/><ellipse cx="80" cy="60" rx="7" ry="10" fill="#7EC8FF"/><rect x="17" y="24" width="66" height="64" rx="30" fill="'+BLUE+'"/><ellipse cx="50" cy="72" rx="22" ry="14" fill="#E8F5FF"/>'+eyes+mouth+'</svg>';
}

const $=id=>document.getElementById(id);
let ws=null,listening=false,currentState='connecting',wakeWordEnabled=false;
let lastUserText='',reconnectDelay=1000,reconnectTimer=null;
let timerInterval=null,timerSeconds=0;
let lightLevel=0;

function updateTime(){
  const now=new Date(),t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  $('timeDisplay').textContent=t;$('clockTime').textContent=t;
}
setInterval(updateTime,10000);updateTime();

function setMascot(mood){$('mascotWrap').innerHTML=mascotSVG(90,90,mood);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}

function updateBulb(level){
  lightLevel=level;
  var panel=$('bulbPanel'),cls=['bulb-off','bulb-low','bulb-mid','bulb-high'];
  var labels=['关','弱','中等','全亮'];
  cls.forEach(function(c){panel.classList.remove(c);});
  panel.classList.add(cls[level]||'bulb-off');
  $('bulbLabel').textContent=labels[level]||'关';
}
function cycleBulb(){
  var next=(lightLevel+1)%4;
  updateBulb(next);
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'light_toggle'}));
}

function clearConversation(){$('conversation').innerHTML='';}
function addBubble(text,cls){
  const d=document.createElement('div');d.className='bubble '+cls;d.textContent=text;
  $('conversation').appendChild(d);
  $('conversation').scrollTop=$('conversation').scrollHeight;
}

function setUIState(state){
  currentState=state;
  hide('idleView');hide('waveWrap');hide('thinkingWrap');
  $('stateLabel').textContent='';$('card').classList.remove('recording');
  switch(state){
    case 'connecting':
      $('mainBtn').disabled=true;$('mainBtn').innerHTML='⏳ 连接中...';
      $('hintText').textContent='正在连接服务...';
      $('serverDot').className='status-dot connecting';$('serverLabel').textContent='连接中';
      setMascot('sleep');break;
    case 'disconnected':
      $('mainBtn').disabled=false;$('mainBtn').innerHTML='🔌 重新连接';
      $('mainBtn').className='btn btn-primary';$('hintText').textContent='服务断开，点击重连';
      $('serverDot').className='status-dot offline';$('serverLabel').textContent='断开';
      setMascot('sleep');listening=false;break;
    case 'idle':
      $('mainBtn').disabled=false;$('mainBtn').innerHTML='🎤 开始对话';
      $('mainBtn').className='btn btn-primary';
      $('hintText').textContent=wakeWordEnabled?'说「你好灵犀」唤醒':'点击按钮开始对话';
      $('serverDot').className='status-dot online';$('serverLabel').textContent='在线';
      show('idleView');setMascot('sleep');listening=false;break;
    case 'listening':
      $('mainBtn').disabled=false;$('mainBtn').innerHTML='⏹ 停止';
      $('mainBtn').className='btn btn-stop';$('hintText').textContent='正在聆听...';
      $('card').classList.add('recording');show('waveWrap');setMascot('happy');
      listening=true;break;
    case 'thinking':
      $('mainBtn').innerHTML='⏹ 停止';$('mainBtn').className='btn btn-stop';
      $('hintText').textContent='正在思考...';show('thinkingWrap');setMascot('think');break;
    case 'speaking':
      $('mainBtn').disabled=false;$('mainBtn').innerHTML='⏹ 打断';
      $('mainBtn').className='btn btn-stop';$('hintText').textContent='播报中，点击打断';
      show('waveWrap');setMascot('happy');break;
  }
}

function updateUserBubble(text){
  var el=$('conversation').querySelector('.bubble.user:last-child');
  if(el){el.textContent=text;}else{addBubble(text,'user');}
  lastUserText=text;
}

var aiTypeTimer=null;
function updateAiBubble(text,animate){
  if(aiTypeTimer){clearInterval(aiTypeTimer);aiTypeTimer=null;}
  var el=$('conversation').querySelector('.bubble.ai:last-child');
  if(!el){addBubble('','ai');el=$('conversation').querySelector('.bubble.ai:last-child');}
  if(animate){
    var i=el.textContent.length;
    aiTypeTimer=setInterval(function(){i++;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(aiTypeTimer);},30);
  }else{el.textContent=text;}
}

function connectWS(){
  if(ws){try{ws.close();}catch(e){}ws=null;}
  var url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';
  ws=new WebSocket(url);ws.binaryType='arraybuffer';
  ws.onopen=function(){console.log('[WS] open');reconnectDelay=1000;setUIState('connecting');};
  ws.onmessage=function(e){
    if(typeof e.data==='string'){
      try{handleMsg(JSON.parse(e.data));}catch(err){}
    }
  };
  ws.onclose=function(){ws=null;setUIState('disconnected');
    if(reconnectTimer)clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(function(){reconnectDelay=Math.min(reconnectDelay*2,10000);connectWS();},reconnectDelay);
  };
  ws.onerror=function(){};
}

function handleMsg(d){
  switch(d.type){
    case 'state':setUIState(d.state);break;
    case 'stt':if(d.text)updateUserBubble(d.text);break;
    case 'llm':
      if(d.emotion){var m={happy:'happy',neutral:'happy',sad:'sleep',angry:'sleep',think:'think'};setMascot(m[d.emotion]||'happy');}
      break;
    case 'tts':
      if(d.state==='start'){clearConversation();if(lastUserText)addBubble(lastUserText,'user');}
      if(d.text)updateAiBubble(d.text,true);  // AI回复文字在tts消息中
      break;
    case 'error':$('hintText').textContent='⚠ '+d.message;break;
    case 'wake_word':wakeWordEnabled=d.enabled;updateWW();break;
    case 'timer_start':startTimerDisplay(d.seconds,d.label);break;
    case 'timer_done':timerDone(d.label);break;
    case 'timer_cancelled':console.log('[WS] timer_cancelled received');cancelTimer();break;
    case 'light_state':updateBulb(d.level);break;
  }
}

$('mainBtn').addEventListener('click',function(){
  var st=currentState;
  if(st==='disconnected'||st==='connecting'){connectWS();return;}
  if(st==='speaking'){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'abort'}));
    clearConversation();listening=false;return;}
  if(listening){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'stop_listening'}));listening=false;}
  else{if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:'start_listening'}));clearConversation();}}
});

setMascot('sleep');connectWS();

function toggleWW(){
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'toggle_wake_word'}));
}
function updateWW(){
  $('wwDot').style.display=wakeWordEnabled?'inline-block':'none';
  $('wwLabel').textContent=wakeWordEnabled?'唤醒:开':'唤醒:关';
  if(currentState==='idle')$('hintText').textContent=wakeWordEnabled?'说「你好灵犀」唤醒':'点击按钮开始对话';
}

// ========== 计时器 ==========
function setTimer(min){
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_timer',minutes:min,label:min+'分钟'}));
}
function setTimerFromInput(){
  var v=parseInt($('timerInput').value,10);
  if(!v||v<1){$('hintText').textContent='请输入分钟数';return;}
  if(v>999)v=999;
  setTimer(v);
  $('timerInput').value='';
}
$('timerInput').addEventListener('keydown',function(e){if(e.key==='Enter')setTimerFromInput();});
function cancelTimer(){
  console.log('[cancelTimer] hiding timer area');
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=null;timerSeconds=0;
  $('timerArea').style.display='none';
}
function startTimerDisplay(seconds,label){
  timerSeconds=seconds;
  $('timerLabel').textContent=label;
  $('timerArea').style.display='block';
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timerSeconds--;
    if(timerSeconds<=0){cancelTimer();return;}
    var m=Math.floor(timerSeconds/60),s=timerSeconds%60;
    $('timerCount').textContent=m+':'+String(s).padStart(2,'0');
  },1000);
  var m=Math.floor(timerSeconds/60),s=timerSeconds%60;
  $('timerCount').textContent=m+':'+String(s).padStart(2,'0');
}
function timerDone(label){
  cancelTimer();
  alert('⏰ '+label+' 时间到!');
  $('hintText').textContent='⏰ '+label+' 时间到!';
}
</script>
</body>
</html>
